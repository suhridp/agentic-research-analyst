[project]
name = "agentic-research-analyst"
version = "0.2.0"
description = "Claim-level cited research answers with evidence verification, and an evaluation harness that measures whether verification helps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.110"]

[tool.setuptools]
packages = ["ara", "ara.retrieval", "common", "eval", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:sentence-transformers unavailable", "ignore:cross-encoder unavailable"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["data", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E731", "SIM108", "B905", "SIM905", "UP038"]

[tool.ruff.lint.isort]
known-first-party = ["ara", "common", "eval", "api"]
