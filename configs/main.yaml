# Main comparison (milestone 5): baselines vs full agentic system vs ablations, on the REAL corpus.
#   python -m eval.run configs/main.yaml                      # dev split
#   python -m eval.run configs/main.yaml --split test --confirm-test   # once, at the end
name: main_comparison
corpus: {path: data/corpus, max_words: 160, overlap: 1}
questions: data/questions.jsonl
split: dev
require_neural: true          # fail instead of silently falling back to LSA / lexical reranking
llm:
  provider: anthropic
  model: claude-sonnet-5-5
  temperature: 0
  max_cost_usd: 25            # hard spend cap for the whole run (needs prices.yaml), else use max_tokens
  max_tokens: 20000000
judge:                        # a different model from the system under test
  provider: anthropic
  model: claude-opus-5-5
  temperature: 0
  max_cost_usd: 15
prices: configs/prices.yaml
workers: 4
reference: agentic_full
defaults:
  k: 5
  retriever: {kind: hybrid, encoder: "sbert:BAAI/bge-small-en-v1.5", rerank: "cross-encoder:cross-encoder/ms-marco-MiniLM-L-6-v2"}
systems:
  - {name: bm25_rag, kind: rag, retriever: {kind: bm25, rerank: null}}
  - {name: hybrid_rerank_rag, kind: rag}
  - {name: agentic_full}
  - {name: no_planner, planner: false}
  - {name: no_verifier, verifier: none}
  - {name: no_critic, critic: false}
