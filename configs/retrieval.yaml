# Milestone 3: does hybrid + reranking beat BM25 on Recall@5? No LLM needed (except the optional LLM reranker).
#   python -m eval.retrieval_eval configs/retrieval.yaml
name: retrieval
corpus: {path: data/corpus, max_words: 160, overlap: 1}
questions: data/questions.jsonl
split: dev
ks: [1, 3, 5, 10]
retrievers:          # the first one is the baseline for paired comparisons
  - {name: bm25, kind: bm25}
  - {name: dense_bge, kind: dense, encoder: "sbert:BAAI/bge-small-en-v1.5"}
  - {name: hybrid_rrf, kind: hybrid, encoder: "sbert:BAAI/bge-small-en-v1.5"}
  - {name: hybrid_rrf_ce, kind: hybrid, encoder: "sbert:BAAI/bge-small-en-v1.5", rerank: "cross-encoder:cross-encoder/ms-marco-MiniLM-L-6-v2"}
  - {name: bm25_ce, kind: bm25, rerank: "cross-encoder:cross-encoder/ms-marco-MiniLM-L-6-v2"}
